services:
  wallbit-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wallbit-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////data/wallbit.db
    volumes:
      - ./data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
